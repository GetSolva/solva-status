owner: GetSolva
repo: solva-status

# Technical addresses stay in repository secrets: the public page shows the service, not its host.
secrets:
  - DASHBOARD_API_HEALTH_URL
  - BRIDGE_HEALTH_URL

# Keep the existing slugs so Upptime retains service history and incident links.
sites:
  - name: Solva website
    slug: site-getsolva-fr
    url: https://getsolva.fr
  - name: Dashboard sign-in
    slug: tableau-de-bord-connexion
    url: https://app.getsolva.fr/sign-in
  # Serves the dashboard, the WhatsApp and widget agents and the reminders.
  - name: Solva server (WhatsApp, widget, reminders)
    slug: serveur-solva-whats-app-widget-rappels
    url: $DASHBOARD_API_HEALTH_URL
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Doctolib calendar sync
    slug: synchronisation-agenda-doctolib
    url: $BRIDGE_HEALTH_URL
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Patient portal
    slug: espace-patient
    url: https://patient.getsolva.fr
  - name: Onboarding questionnaire
    slug: questionnaire-d-installation
    url: https://onboarding.getsolva.fr

status-website:
  cname: status.getsolva.fr
  logoUrl: https://app.getsolva.fr/favicon.svg
  favicon: https://app.getsolva.fr/favicon-96x96.png
  faviconSvg: https://app.getsolva.fr/favicon.svg
  themeUrl: https://status.getsolva.fr/solva-theme.css
  name: Solva Status
  introTitle: "Live **Solva** service status"
  introMessage: We check each service every five minutes and post updates here during outages.
  metaTags:
    - name: description
      content: Check the availability of Solva services and follow updates on incidents and scheduled maintenance.
  navbar:
    - title: Status
      href: /
    - title: getsolva.fr
      href: https://getsolva.fr

skipDescriptionUpdate: true

# Plain-text history: Upptime reads each service status from the first word of its last commit,
# so the emoji prefixes are replaced by single words rather than removed.
commitPrefixStatusUp: OK
commitPrefixStatusDown: PANNE
commitPrefixStatusDegraded: RALENTI
commitMessages:
  statusChange: "$PREFIX $SITE_NAME : $STATUS ($RESPONSE_CODE en $RESPONSE_TIME ms) [skip ci] [upptime]"
  readmeContent: "Mise à jour du résumé [skip ci] [upptime]"
  summaryJson: "Mise à jour des statuts [skip ci] [upptime]"
  graphsUpdate: "Mise à jour des graphiques [skip ci] [upptime]"

i18n:
  footer: Solva status page, powered by [Upptime](https://upptime.js.org)
