owner: GetSolva
repo: solva-status

# Technical addresses stay in repository secrets: the public page shows the service, not its host.
secrets:
  - DASHBOARD_API_HEALTH_URL
  - BRIDGE_HEALTH_URL

sites:
  - name: Site getsolva.fr
    url: https://getsolva.fr
  - name: Tableau de bord (connexion)
    url: https://app.getsolva.fr/sign-in
  # Serves the dashboard, the WhatsApp and widget agents and the reminders.
  - name: Serveur Solva (WhatsApp, widget, rappels)
    url: $DASHBOARD_API_HEALTH_URL
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Synchronisation agenda Doctolib
    url: $BRIDGE_HEALTH_URL
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Espace patient
    url: https://patient.getsolva.fr
  - name: Questionnaire d'installation
    url: https://onboarding.getsolva.fr

status-website:
  cname: status.getsolva.fr
  logoUrl: https://app.getsolva.fr/favicon.svg
  favicon: https://app.getsolva.fr/favicon-96x96.png
  faviconSvg: https://app.getsolva.fr/favicon.svg
  themeUrl: https://status.getsolva.fr/solva-theme.css
  name: Statut Solva
  introTitle: "État des services **Solva** en direct"
  introMessage: Chaque service est testé automatiquement toutes les 5 minutes. En cas de panne, l'équipe Solva publie ici ce qui se passe et quand c'est réglé.
  navbar:
    - title: Statut
      href: /
    - title: getsolva.fr
      href: https://getsolva.fr

skipDescriptionUpdate: true

# Plain-text history: no emoji in commit messages.
commitMessages:
  statusChange: "$SITE_NAME : $STATUS ($RESPONSE_CODE en $RESPONSE_TIME ms) [skip ci] [upptime]"
  readmeContent: "Mise à jour du résumé [skip ci] [upptime]"
  summaryJson: "Mise à jour des statuts [skip ci] [upptime]"
  graphsUpdate: "Mise à jour des graphiques [skip ci] [upptime]"

